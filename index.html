<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Into the Pitch: Learn to Attack</title>
    <meta
      name="description"
      content="Interactive lessons that teach football video game players how to attack using real formations and movement patterns."
    />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=panchang@500,600,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap"
    />
    <script>
      try {
        var theme = localStorage.getItem('itp-theme');
        if (theme !== 'day' && theme !== 'night') {
          theme = 'night';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'night' ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
